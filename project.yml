name: MyMacCleaner
options:
  bundleIdPrefix: com.jsh
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGNING_ALLOWED: "NO"
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: "NO"
    SWIFT_STRICT_CONCURRENCY: complete

targets:
  MyMacCleaner:
    type: application
    platform: macOS
    sources:
      - path: MyMacCleaner
        excludes:
          - "Resources/Info.plist"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jsh.MyMacCleaner
        PRODUCT_NAME: MyMacCleaner
        INFOPLIST_FILE: MyMacCleaner/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: MyMacCleaner/Resources/MyMacCleaner.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: "YES"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
    info:
      path: MyMacCleaner/Resources/Info.plist
      properties:
        CFBundleDisplayName: MyMacCleaner
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSApplicationCategoryType: public.app-category.utilities
        LSMinimumSystemVersion: "14.0"
        NSHumanReadableCopyright: "© 2026"
        NSMainStoryboardFile: ""
        LSUIElement: false
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: MyMacCleaner/Resources/MyMacCleaner.entitlements
      properties:
        com.apple.security.app-sandbox: false
        com.apple.security.files.user-selected.read-write: true

  MyMacCleanerTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: MyMacCleanerTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jsh.MyMacCleanerTests
    dependencies:
      - target: MyMacCleaner

schemes:
  MyMacCleaner:
    build:
      targets:
        MyMacCleaner: all
        MyMacCleanerTests: [test]
    test:
      config: Debug
      targets:
        - MyMacCleanerTests
    run:
      config: Debug
